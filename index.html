<style>

.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}

.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
input[type=checkbox]{min-width:0;padding:0}.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px;max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px}.pk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}aside{position:sticky;top:10px}.nw a{color:var(--ac);text-decoration:none}.nw>div{padding:7px 0;border-bottom:1px solid var(--bd)}@media(max-width:900px){.split{grid-template-columns:1fr}aside{position:static}}#tk{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--bd);font-size:13px;padding:6px 0}#tk .st{flex:none;padding:0 12px;font-weight:600;border-right:1px solid var(--bd);margin-right:6px}#tk .tr{display:inline-block;white-space:nowrap;animation:tkm 60s linear infinite}#tk:hover .tr{animation-play-state:paused}.ti{margin:0 18px}@keyframes tkm{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){#tk .tr{animation:none}#tk>div{overflow:auto!important}}.vm{height:min(560px,calc(100vh - 260px));min-height:320px;overflow:hidden}.vt{animation:vms 40s linear infinite}.vm:hover .vt{animation-play-state:paused}.vr{display:flex;justify-content:space-between;gap:10px;padding:9px 13px;border-bottom:1px solid var(--bd);cursor:pointer;font-variant-numeric:tabular-nums}.vr:hover{background:var(--bg)}@keyframes vms{from{transform:translateY(0)}to{transform:translateY(-50%)}}@media(prefers-reduced-motion:reduce){.vt{animation:none}.vm{overflow:auto}}.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}#hs{margin-top:12px}.hsc{max-height:380px;overflow:auto;border:1px solid var(--bd);border-radius:8px;margin-top:8px}.hsc table{min-width:560px}.hsc th{position:sticky;top:0;background:var(--card)}@media(prefers-reduced-motion:no-preference){@keyframes fu{from{opacity:0;transform:translateY(16px)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}@keyframes fa{to{opacity:.08}}@keyframes gr{from{transform:scaleX(0)}}@keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.4)}}@keyframes bu{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes bd{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.enter .grid>.card{animation:fu .6s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
.enter .grid polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease-out forwards;animation-delay:calc(var(--i,0)*80ms + 350ms)}
.enter h2,.enter #br,.enter #ovr .card{animation:fu .6s .35s cubic-bezier(.2,.7,.2,1) backwards}
.enter #br>div>div:first-child{transform-origin:left;animation:gr 1.1s .8s cubic-bezier(.2,.7,.2,1) backwards}
.card.click{transition:transform .2s,box-shadow .2s,border-color .2s}.card.click:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14)}
#ms .up,.lv{display:inline-block;animation:pl 1.6s ease-in-out infinite}.ar{display:inline-block}.vr .up .ar{animation:bu 1.2s ease-in-out infinite}.vr .dn .ar{animation:bd 1.2s ease-in-out infinite}.vr{transition:background .2s,padding-left .2s}.vr:hover{padding-left:19px}}
.vm{-webkit-mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent)}html,body{height:100%}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header,#tk,.tabs,#bn,#hits,footer{flex:none}
main{flex:1;min-height:0;overflow:auto;max-width:none;margin:0;padding:16px max(18px,calc((100% - 1150px)/2))}
#hits{margin:0!important;padding:2px 0}footer{padding:8px 18px!important}aside#ovr{position:static}</style></head><body>
<header><div class="brand"><h1>Bharat Market Analyzer<small>NSE (Nifty) &amp; BSE (Sensex) trend dashboards</small></h1></div>

<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls=n=>n>=0?'up':'dn',sg=n=>(n>=0?'+':'')+fmt(n)+'%';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>[...s].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619),2166136261);
const N=250,cache={},REAL={};let AG=null;
const fit=a=>{a=a.slice(-N);while(a.length<N)a.unshift(a[0]);return a};
function series(k,base,vol,dr){if(cache[k])return cache[k];if(REAL[k])return cache[k]=fit(REAL[k]);const r=rng(hash(k)),a=[1];
 for(let i=1;i<N;i++){const z=(r()+r()+r()-1.5)*2;a.push(a[i-1]*(1+dr/N+z*vol))}
 const f=base/a[N-1];return cache[k]=a.map(v=>v*f)}
const IDX={NSE:[['NIFTY 50',24800,.007,.09],['NIFTY BANK',53500,.009,.08],['NIFTY IT',38500,.011,.04],['NIFTY NEXT 50',69000,.009,.1],['NIFTY MIDCAP 100',57500,.011,.15],['NIFTY FMCG',56000,.007,.03]],
BSE:[['SENSEX',81500,.007,.09],['BSE 500',35500,.008,.11],['BSE MIDCAP',46500,.011,.14],['BSE SMALLCAP',53000,.012,.17],['BSE BANKEX',60500,.009,.08],['BSE IT',37500,.011,.04]]};
const ST=[['RELIANCE','Reliance Industries','Energy',1420,500325],['TCS','Tata Consultancy','IT',3250,532540],['HDFCBANK','HDFC Bank','Banking',1000,500180],['ICICIBANK','ICICI Bank','Banking',1420,532174],['INFY','Infosys','IT',1560,500209],['SBIN','State Bank of India','Banking',830,500112],['BHARTIARTL','Bharti Airtel','Telecom',1950,532454],['ITC','ITC Ltd','FMCG',415,500875],['LT','Larsen & Toubro','Infra',3600,500510],['HINDUNILVR','Hindustan Unilever','FMCG',2450,500696],['SUNPHARMA','Sun Pharma','Pharma',1700,524715],['MARUTI','Maruti Suzuki','Auto',12800,532500],['TATAMOTORS','Tata Motors','Auto',700,500570],['M&M','Mahindra & Mahindra','Auto',3300,500520],['AXISBANK','Axis Bank','Banking',1150,532215],['WIPRO','Wipro','IT',260,507685],['NTPC','NTPC','Power',340,532555],['ONGC','ONGC','Energy',245,500312],['TITAN','Titan Company','Consumer',3500,500114],['ASIANPAINT','Asian Paints','Consumer',2350,500820],['DRREDDY','Dr Reddy\'s Labs','Pharma',1250,500124],['ADANIPORTS','Adani Ports','Infra',1400,532921]]
.map(([s,n,sec,p,b],i)=>({s,n,sec,p,b,v:.012+(hash(s)%7)/1000,d:((hash(s)%20)-4)/100}));
try{JSON.parse(localStorage.getItem('cs')||'[]').forEach(([s,n,sec,p])=>ST.push(mkStock(s,n,sec,p)))}catch(e){}
const S=x=>series(x.s,x.p,x.v,x.d), I=x=>series(x[0],x[1],x[2],x[3]);
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((p,c)=>p+c,0)/n);
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100}
const chg=(a,d=1)=>(a[a.length-1]/a[a.length-1-d]-1)*100;
let st={x:'NSE',tab:'Overview',idx:0,sym:'RELIANCE',rg:126,wl:[]};
try{st.wl=JSON.parse(localStorage.getItem('wl')||'[]')}catch(e){}
if(!st.wl.length)st.wl=['TCS','HDFCBANK','ITC'];
const saveWL=()=>{try{localStorage.setItem('wl',JSON.stringify(st.wl))}catch(e){}};
function spark(a,w=180,h=44){const mn=Math.min(...a),mx=Math.max(...a),p=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1));
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:44px"><polyline pathLength="1" fill="none" stroke="var(${a[a.length-1]>=a[0]?'--up':'--dn'})" stroke-width="1.6" points="${p.join(' ')}"/></svg>`}
function chart(id,ser,n,labels,u='₹'){const W=700,H=280,L=52,B=8,T=8,w=W-L-6,h=H-T-B;
 const sl=a=>a.slice(-n),all=ser.flatMap(s=>sl(s.d).filter(v=>v!=null)),mn=Math.min(...all),mx=Math.max(...all);
 const X=i=>L+i/(n-1)*w,Y=v=>T+(1-(v-mn)/(mx-mn||1))*h;
 let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mu)">${fmt(v,0)}</text>`}
 const lines=ser.map(s=>{const d=sl(s.d);let p='';d.forEach((v,i)=>{if(v!=null)p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});return `<path d="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" ${s.da?'stroke-dasharray="4 3"':''}/>`}).join('');
 const m=sl(ser[0].d),area=`<path d="M${X(0)} ${Y(mn)} ${m.map((v,i)=>'L'+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')} L${X(n-1)} ${Y(mn)}Z" fill="${ser[0].c}" opacity=".08"/>`;
 $(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}${area}${lines}<line id="cx" y1="${T}" y2="${H-B}" stroke="var(--mu)" opacity="0"/></svg><div class="tip"></div>`;
 const svg=$(id+' svg'),tip=$(id+' .tip'),cx=$('#cx');
 svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-L)/w*(n-1))));
  cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity',1);
  tip.style.display='block';tip.style.left=Math.min(r.width-150,Math.max(0,X(i)/W*r.width-60))+'px';tip.style.top='6px';
  tip.textContent=`${labels(i,n)} · ${u}${fmt(m[i])}`};
 svg.onmouseleave=()=>{tip.style.display='none';cx.setAttribute('opacity',0)}}
const dayLbl=(i,n)=>{const d=new Date(2026,9,26);d.setDate(d.getDate()-Math.round((n-1-i)*1.46));return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'})};
const BT=['Overview','Stock Analyzer','Sectors','Movers & Watchlist','Mutual Funds','Metals','Currencies','Agent Signals','My Stocks'];
let CFG={name:'',hidden:[],tabs:[]};
try{const c=JSON.parse(localStorage.getItem('cfg')||'null');if(c)CFG=Object.assign(CFG,c)}catch(e){}
const saveCFG=()=>{try{localStorage.setItem('cfg',JSON.stringify(CFG))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALLIDX=[...IDX.NSE,...IDX.BSE];
const lookup=k=>{const s=ST.find(x=>x.s==k);if(s)return{n:s.n,a:S(s),st:s};const i=ALLIDX.find(x=>x[0]==k);return i?{n:k,a:I(i)}:null};
function render(){
 const vis=BT.filter(t=>!CFG.hidden.includes(t)),all=[...vis.map(t=>({k:t,n:t})),...CFG.tabs.map(t=>({k:'c:'+t.id,n:(t.lock&&CFG.pin?(st.unl?'🔓 ':'🔒 '):'')+t.name})),{k:'Customize',n:'⚙ Customize'}];
 if(!all.some(t=>t.k==st.tab))st.tab=all[0].k;
 const nm=CFG.name.trim();$('h1').firstChild.nodeValue=nm?nm+'’s Market Dashboard':'Bharat Market Analyzer';document.title=nm?nm+'’s Market Dashboard':'Bharat Market Analyzer';
 $('#tabs').innerHTML=all.map(t=>`<button class="${t.k==st.tab?'on':''}" data-t="${esc(t.k)}">${esc(t.n)}</button>`).join('')+'<button data-a="new" title="Add your own tab">＋</button>';
 $('#ex').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.x==st.x));
 st.enter=st.tab=='Overview';const f=({Overview:ov,'Stock Analyzer':an,Sectors:sec,'Movers & Watchlist':mv,'Mutual Funds':mf,Metals:mt,Currencies:cu,'Agent Signals':ag,'My Stocks':ms,Customize:cz})[st.tab];
 f?f():(()=>{const t=CFG.tabs.find(t=>'c:'+t.id==st.tab);t&&t.lock&&CFG.pin&&!st.unl?lk(t):cv(t)})()}
function cv(t){if(!t)return;const rows=t.items.map(k=>({k,...lookup(k)})).filter(r=>r.a);
 const head=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(t.name)}</h2><span>${t.lock&&CFG.pin?'<button class="btn o" data-a="lockNow">🔒 Lock now</button> ':''}<button class="btn o" data-a="edit" data-id="${t.id}">Edit tab</button></span></div>`;
 if(!rows.length){$('#app').innerHTML=head+'<div class="card">This tab is empty. Use Edit tab to choose stocks or indices.</div>';return}
 const body=t.view=='table'?`<div class="card wrap"><table><tr><th>Name</th><th class="r">Price ₹</th><th class="r">1D</th><th class="r">1W</th><th class="r">1M</th><th class="r">3M</th><th class="r">RSI</th></tr>${rows.map(r=>{const a=r.a;return `<tr class="${r.st?'lk':''}" ${r.st?`data-s="${esc(r.k)}"`:''}><td>${esc(r.k)}<div class="nm">${esc(r.n)}</div></td><td class="r">${fmt(a[N-1])}</td>${[1,5,21,63].map(d=>`<td class="r ${cls(chg(a,d))}">${sg(chg(a,d))}</td>`).join('')}<td class="r">${fmt(rsi(a),0)}</td></tr>`}).join('')}</table></div>`
 :`<div class="grid">${rows.map(r=>{const a=r.a;return `<div class="card ${r.st?'click':''}" ${r.st?`data-s="${esc(r.k)}"`:''}><div class="nm">${esc(r.k)}${r.st?' · '+esc(r.n):''}</div><div class="big">${fmt(a[N-1])}</div><div><span class="${cls(chg(a))}">${sg(chg(a))}</span> <span class="nm">1D</span> · <span class="${cls(chg(a,21))}">${sg(chg(a,21))}</span> <span class="nm">1M</span> · <span class="nm">RSI ${fmt(rsi(a),0)}</span></div>${spark(a.slice(-60))}</div>`}).join('')}</div>`;
 $('#app').innerHTML=head+body+'<p class="note">Tap a stock to open it in the analyzer.</p>'}
function tabForm(ed){const box=l=>l.map(([k,lab])=>`<label class="pk"><input type="checkbox" value="${esc(k)}" ${ed.items.includes(k)?'checked':''}> ${esc(lab)}</label>`).join('');
 return `<div class="card" id="fm" style="margin-top:12px"><h2 style="margin-top:0">${ed.id?'Edit tab':'New tab'}</h2><div class="row"><input id="fn" placeholder="Tab name, e.g. My banks" value="${esc(ed.name)}"><select id="fv"><option value="cards"${ed.view=='cards'?' selected':''}>Cards view</option><option value="table"${ed.view=='table'?' selected':''}>Table view</option></select></div><label class="pk" style="margin-bottom:8px"><input type="checkbox" id="fl" ${ed.lock?'checked':''}> 🔒 Lock this tab with my PIN</label><input id="fq" placeholder="Filter the list…" style="width:100%;margin-bottom:8px"><div class="nm">Indices</div><div class="picks">${box(ALLIDX.map(i=>[i[0],i[0]]))}</div><div class="nm" style="margin-top:8px">Stocks</div><div class="picks">${box(ST.map(s=>[s.s,s.s+' · '+s.n]))}</div><div class="row" style="margin:12px 0 0"><button class="btn" data-a="savetab">Save tab</button><button class="btn o" data-a="cancel">Cancel</button></div></div>`}

function hist(x){const el=$('#hs');if(!el)return;loadHS();const H=histRows(x.s);
 const hd=`<div class="row" style="justify-content:space-between;margin:0 0 8px"><h2 style="margin:0">Price history · ${esc(x.s)}</h2>${H.r?'<button class="btn o" data-hcsv="1">⬇ CSV</button>':''}</div>`;
 if(!H.r){el.innerHTML=`<div class="card">${hd}<div class="nm">${H.msg}</div></div>`;return}
 const R=H.r,n=R.length,pch=i=>i>0?(R[i].c/R[i-1].c-1)*100:0,ret=d=>n>d?(R[n-1].c/R[n-1-d].c-1)*100:null;
 let hi=R[0],lo=R[0],bi=1,wi=1;R.forEach((r,i)=>{if(r.h>hi.h)hi=r;if(r.l<lo.l)lo=r;if(i&&pch(i)>pch(bi))bi=i;if(i&&pch(i)<pch(wi))wi=i});
 const per=[['1W',5],['1M',21],['3M',63],['6M',126],['1Y',249]].map(([l,d])=>{const v=ret(d);return `<div><span class="nm">${l}</span><b class="${v==null?'':cls(v)}">${v==null?'—':sg(v)}</b></div>`}).join('');
 const ex=`<div><span class="nm">High · ${esc(hi.d)}</span><b>₹${fmt(hi.h)}</b></div><div><span class="nm">Low · ${esc(lo.d)}</span><b>₹${fmt(lo.l)}</b></div><div><span class="nm">Best day · ${esc(R[bi].d)}</span><b class="up">${sg(pch(bi))}</b></div><div><span class="nm">Worst day · ${esc(R[wi].d)}</span><b class="dn">${sg(pch(wi))}</b></div>`;
 const hr=st.hr||63,rows=[];for(let i=n-1;i>=Math.max(0,n-hr);i--){const r=R[i],c=pch(i);rows.push(`<tr><td>${esc(r.d)}</td><td class="r">${fmt(r.o)}</td><td class="r">${fmt(r.h)}</td><td class="r">${fmt(r.l)}</td><td class="r">${fmt(r.c)}</td><td class="r ${cls(c)}">${i?sg(c):'—'}</td><td class="r">${vf(r.v)}</td></tr>`)}
 el.innerHTML=`<div class="card">${hd}${H.sim?'<div class="nm" style="margin-bottom:8px">Simulated data. Real history appears once the agent has run.</div>':''}<div class="stats" style="margin:0 0 12px">${per}${ex}</div><div class="row">${[[21,'1M'],[63,'3M'],[126,'6M'],[250,'1Y']].map(([k,l])=>`<button class="btn ${hr==k?'':'o'}" data-hr="${k}">${l}</button>`).join('')}<span class="nm">${rows.length} trading days · newest first</span></div><div class="hsc"><table><tr><th>Date</th><th class="r">Open</th><th class="r">High</th><th class="r">Low</th><th class="r">Close</th><th class="r">Change</th><th class="r">Volume</th></tr>${rows.join('')}</table></div></div>`}
document.addEventListener('click',e=>{const a=e.target.closest('[data-hr]');if(a){st.hr=+a.dataset.hr;const x=ST.find(s=>s.s==st.sym);x&&hist(x);return}
 if(e.target.closest('[data-hcsv]')){const H=histRows(st.sym);if(!H.r)return;const csv='Date,Open,High,Low,Close,Change %,Volume\n'+H.r.map((r,i)=>[r.d,r.o,r.h,r.l,r.c,i?((r.c/H.r[i-1].c-1)*100).toFixed(2):'',r.v||''].join(',')).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download=st.sym+'-history.csv';x.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});
const RM=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el,to,ms=1000){if(RM()||!window.requestAnimationFrame)return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=fmt(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function animChart(sel){if(RM())return;document.querySelectorAll(sel+' svg path').forEach((p,i)=>{if(i==1){p.setAttribute('pathLength','1');p.style.cssText='stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s ease-out forwards'}else{p.style.cssText='opacity:0;animation:'+(i==0?'fa .8s .9s':'fi .8s 1.2s')+' ease forwards'}})}
const GC='';   // your GoatCounter code (the part before .goatcounter.com); leave empty to turn the counter off
if(GC){const s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';s.dataset.goatcounter='https://'+GC+'.goatcounter.com/count';document.head.appendChild(s);
 fetch('https://'+GC+'.goatcounter.com/counter/TOTAL.json').then(r=>r.json()).then(d=>{$('#hits').textContent='👁 '+d.count+' total page views'}).catch(()=>{})}
fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.stocks){Object.assign(REAL,d.stocks,d.indices||{});AG=d}}).catch(()=>{}).then(()=>{banner();render();refresh()});
