<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bharat Market Analyzer – NSE &amp; BSE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6eb;--ac:#2f5bea;--up:#0a8f4e;--dn:#d6342c;--upb:#e3f6ec;--dnb:#fde8e6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#262c36;--ac:#6f93ff;--up:#35c47c;--dn:#ff6b61;--upb:#12301f;--dnb:#3a1b19}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#262c36;--ac:#6f93ff;--up:#35c47c;--dn:#ff6b61;--upb:#12301f;--dnb:#3a1b19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:17px;margin:0}h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button,.tabs button{background:none;border:0;color:var(--mu);padding:7px 13px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.tabs{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto}
.tabs button{border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{padding:16px 18px;max-width:1150px;margin:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px}
.card.click{cursor:pointer}.card.click:hover,.card.sel{border-color:var(--ac)}
.nm{color:var(--mu);font-size:12px}.big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font:inherit;min-width:200px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.chart{position:relative;width:100%}.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--bg);padding:3px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.stats div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.stats b{display:block;font-size:15px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:600;font-size:13px}
.badge.up{background:var(--upb)}.badge.dn{background:var(--dnb)}.badge.n{background:var(--bd);color:var(--tx)}
.heat{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.heat div{border-radius:9px;padding:14px 12px;cursor:pointer}.heat b{display:block;font-size:18px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:500;font-size:12px}td.r,th.r{text-align:right}tr.lk{cursor:pointer}tr.lk:hover{background:var(--bg)}
h2{font-size:15px;margin:18px 0 10px}.note{color:var(--mu);font-size:12px;margin-top:16px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
input[type=checkbox]{min-width:0;padding:0}.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px;max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px}.pk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}aside{position:sticky;top:10px}.nw a{color:var(--ac);text-decoration:none}.nw>div{padding:7px 0;border-bottom:1px solid var(--bd)}@media(max-width:900px){.split{grid-template-columns:1fr}aside{position:static}}</style></head><body>
<header><h1>Bharat Market Analyzer<small>NSE (Nifty) &amp; BSE (Sensex) trend dashboards</small></h1>
<div class="seg" id="ex"><button data-x="NSE" class="on">NSE · Nifty</button><button data-x="BSE">BSE · Sensex</button></div></header>
<div class="tabs" id="tabs"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls=n=>n>=0?'up':'dn',sg=n=>(n>=0?'+':'')+fmt(n)+'%';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>[...s].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619),2166136261);
const N=250,cache={},REAL={};let AG=null;
const fit=a=>{a=a.slice(-N);while(a.length<N)a.unshift(a[0]);return a};
function series(k,base,vol,dr){if(cache[k])return cache[k];if(REAL[k])return cache[k]=fit(REAL[k]);const r=rng(hash(k)),a=[1];
 for(let i=1;i<N;i++){const z=(r()+r()+r()-1.5)*2;a.push(a[i-1]*(1+dr/N+z*vol))}
 const f=base/a[N-1];return cache[k]=a.map(v=>v*f)}
const IDX={NSE:[['NIFTY 50',24800,.007,.09],['NIFTY BANK',53500,.009,.08],['NIFTY IT',38500,.011,.04],['NIFTY NEXT 50',69000,.009,.1],['NIFTY MIDCAP 100',57500,.011,.15],['NIFTY FMCG',56000,.007,.03]],
BSE:[['SENSEX',81500,.007,.09],['BSE 500',35500,.008,.11],['BSE MIDCAP',46500,.011,.14],['BSE SMALLCAP',53000,.012,.17],['BSE BANKEX',60500,.009,.08],['BSE IT',37500,.011,.04]]};
const ST=[['RELIANCE','Reliance Industries','Energy',1420,500325],['TCS','Tata Consultancy','IT',3250,532540],['HDFCBANK','HDFC Bank','Banking',1000,500180],['ICICIBANK','ICICI Bank','Banking',1420,532174],['INFY','Infosys','IT',1560,500209],['SBIN','State Bank of India','Banking',830,500112],['BHARTIARTL','Bharti Airtel','Telecom',1950,532454],['ITC','ITC Ltd','FMCG',415,500875],['LT','Larsen & Toubro','Infra',3600,500510],['HINDUNILVR','Hindustan Unilever','FMCG',2450,500696],['SUNPHARMA','Sun Pharma','Pharma',1700,524715],['MARUTI','Maruti Suzuki','Auto',12800,532500],['TATAMOTORS','Tata Motors','Auto',700,500570],['M&M','Mahindra & Mahindra','Auto',3300,500520],['AXISBANK','Axis Bank','Banking',1150,532215],['WIPRO','Wipro','IT',260,507685],['NTPC','NTPC','Power',340,532555],['ONGC','ONGC','Energy',245,500312],['TITAN','Titan Company','Consumer',3500,500114],['ASIANPAINT','Asian Paints','Consumer',2350,500820],['DRREDDY','Dr Reddy\'s Labs','Pharma',1250,500124],['ADANIPORTS','Adani Ports','Infra',1400,532921]]
.map(([s,n,sec,p,b],i)=>({s,n,sec,p,b,v:.012+(hash(s)%7)/1000,d:((hash(s)%20)-4)/100}));
try{JSON.parse(localStorage.getItem('cs')||'[]').forEach(([s,n,sec,p])=>ST.push(mkStock(s,n,sec,p)))}catch(e){}
const S=x=>series(x.s,x.p,x.v,x.d), I=x=>series(x[0],x[1],x[2],x[3]);
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((p,c)=>p+c,0)/n);
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100}
const chg=(a,d=1)=>(a[a.length-1]/a[a.length-1-d]-1)*100;
let st={x:'NSE',tab:'Overview',idx:0,sym:'RELIANCE',rg:126,wl:[]};
try{st.wl=JSON.parse(localStorage.getItem('wl')||'[]')}catch(e){}
if(!st.wl.length)st.wl=['TCS','HDFCBANK','ITC'];
const saveWL=()=>{try{localStorage.setItem('wl',JSON.stringify(st.wl))}catch(e){}};
function spark(a,w=180,h=44){const mn=Math.min(...a),mx=Math.max(...a),p=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1));
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:44px"><polyline fill="none" stroke="var(${a[a.length-1]>=a[0]?'--up':'--dn'})" stroke-width="1.6" points="${p.join(' ')}"/></svg>`}
function chart(id,ser,n,labels){const W=700,H=280,L=52,B=8,T=8,w=W-L-6,h=H-T-B;
 const sl=a=>a.slice(-n),all=ser.flatMap(s=>sl(s.d).filter(v=>v!=null)),mn=Math.min(...all),mx=Math.max(...all);
 const X=i=>L+i/(n-1)*w,Y=v=>T+(1-(v-mn)/(mx-mn||1))*h;
 let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mu)">${fmt(v,0)}</text>`}
 const lines=ser.map(s=>{const d=sl(s.d);let p='';d.forEach((v,i)=>{if(v!=null)p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});return `<path d="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" ${s.da?'stroke-dasharray="4 3"':''}/>`}).join('');
 const m=sl(ser[0].d),area=`<path d="M${X(0)} ${Y(mn)} ${m.map((v,i)=>'L'+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')} L${X(n-1)} ${Y(mn)}Z" fill="${ser[0].c}" opacity=".08"/>`;
 $(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}${area}${lines}<line id="cx" y1="${T}" y2="${H-B}" stroke="var(--mu)" opacity="0"/></svg><div class="tip"></div>`;
 const svg=$(id+' svg'),tip=$(id+' .tip'),cx=$('#cx');
 svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-L)/w*(n-1))));
  cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity',1);
  tip.style.display='block';tip.style.left=Math.min(r.width-150,Math.max(0,X(i)/W*r.width-60))+'px';tip.style.top='6px';
  tip.textContent=`${labels(i,n)} · ₹${fmt(m[i])}`};
 svg.onmouseleave=()=>{tip.style.display='none';cx.setAttribute('opacity',0)}}
const dayLbl=(i,n)=>{const d=new Date(2026,9,26);d.setDate(d.getDate()-Math.round((n-1-i)*1.46));return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'})};
const BT=['Overview','Stock Analyzer','Sectors','Movers & Watchlist','Agent Signals','My Stocks'];
let CFG={name:'',hidden:[],tabs:[]};
try{const c=JSON.parse(localStorage.getItem('cfg')||'null');if(c)CFG=Object.assign(CFG,c)}catch(e){}
const saveCFG=()=>{try{localStorage.setItem('cfg',JSON.stringify(CFG))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALLIDX=[...IDX.NSE,...IDX.BSE];
const lookup=k=>{const s=ST.find(x=>x.s==k);if(s)return{n:s.n,a:S(s),st:s};const i=ALLIDX.find(x=>x[0]==k);return i?{n:k,a:I(i)}:null};
function render(){
 const vis=BT.filter(t=>!CFG.hidden.includes(t)),all=[...vis.map(t=>({k:t,n:t})),...CFG.tabs.map(t=>({k:'c:'+t.id,n:(t.lock&&CFG.pin?(st.unl?'🔓 ':'🔒 '):'')+t.name})),{k:'Customize',n:'⚙ Customize'}];
 if(!all.some(t=>t.k==st.tab))st.tab=all[0].k;
 const nm=CFG.name.trim();$('h1').firstChild.nodeValue=nm?nm+'’s Market Dashboard':'Bharat Market Analyzer';document.title=nm?nm+'’s Market Dashboard':'Bharat Market Analyzer';
 $('#tabs').innerHTML=all.map(t=>`<button class="${t.k==st.tab?'on':''}" data-t="${esc(t.k)}">${esc(t.n)}</button>`).join('')+'<button data-a="new" title="Add your own tab">＋</button>';
 $('#ex').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.x==st.x));
 const f=({Overview:ov,'Stock Analyzer':an,Sectors:sec,'Movers & Watchlist':mv,'Agent Signals':ag,'My Stocks':ms,Customize:cz})[st.tab];
 f?f():(()=>{const t=CFG.tabs.find(t=>'c:'+t.id==st.tab);t&&t.lock&&CFG.pin&&!st.unl?lk(t):cv(t)})()}
function cv(t){if(!t)return;const rows=t.items.map(k=>({k,...lookup(k)})).filter(r=>r.a);
 const head=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(t.name)}</h2><span>${t.lock&&CFG.pin?'<button class="btn o" data-a="lockNow">🔒 Lock now</button> ':''}<button class="btn o" data-a="edit" data-id="${t.id}">Edit tab</button></span></div>`;
 if(!rows.length){$('#app').innerHTML=head+'<div class="card">This tab is empty. Use Edit tab to choose stocks or indices.</div>';return}
 const body=t.view=='table'?`<div class="card wrap"><table><tr><th>Name</th><th class="r">Price ₹</th><th class="r">1D</th><th class="r">1W</th><th class="r">1M</th><th class="r">3M</th><th class="r">RSI</th></tr>${rows.map(r=>{const a=r.a;return `<tr class="${r.st?'lk':''}" ${r.st?`data-s="${esc(r.k)}"`:''}><td>${esc(r.k)}<div class="nm">${esc(r.n)}</div></td><td class="r">${fmt(a[N-1])}</td>${[1,5,21,63].map(d=>`<td class="r ${cls(chg(a,d))}">${sg(chg(a,d))}</td>`).join('')}<td class="r">${fmt(rsi(a),0)}</td></tr>`}).join('')}</table></div>`
 :`<div class="grid">${rows.map(r=>{const a=r.a;return `<div class="card ${r.st?'click':''}" ${r.st?`data-s="${esc(r.k)}"`:''}><div class="nm">${esc(r.k)}${r.st?' · '+esc(r.n):''}</div><div class="big">${fmt(a[N-1])}</div><div><span class="${cls(chg(a))}">${sg(chg(a))}</span> <span class="nm">1D</span> · <span class="${cls(chg(a,21))}">${sg(chg(a,21))}</span> <span class="nm">1M</span> · <span class="nm">RSI ${fmt(rsi(a),0)}</span></div>${spark(a.slice(-60))}</div>`}).join('')}</div>`;
 $('#app').innerHTML=head+body+'<p class="note">Tap a stock to open it in the analyzer.</p>'}
function tabForm(ed){const box=l=>l.map(([k,lab])=>`<label class="pk"><input type="checkbox" value="${esc(k)}" ${ed.items.includes(k)?'checked':''}> ${esc(lab)}</label>`).join('');
 return `<div class="card" id="fm" style="margin-top:12px"><h2 style="margin-top:0">${ed.id?'Edit tab':'New tab'}</h2><div class="row"><input id="fn" placeholder="Tab name, e.g. My banks" value="${esc(ed.name)}"><select id="fv"><option value="cards"${ed.view=='cards'?' selected':''}>Cards view</option><option value="table"${ed.view=='table'?' selected':''}>Table view</option></select></div><label class="pk" style="margin-bottom:8px"><input type="checkbox" id="fl" ${ed.lock?'checked':''}> 🔒 Lock this tab with my PIN</label><input id="fq" placeholder="Filter the list…" style="width:100%;margin-bottom:8px"><div class="nm">Indices</div><div class="picks">${box(ALLIDX.map(i=>[i[0],i[0]]))}</div><div class="nm" style="margin-top:8px">Stocks</div><div class="picks">${box(ST.map(s=>[s.s,s.s+' · '+s.n]))}</div><div class="row" style="margin:12px 0 0"><button class="btn" data-a="savetab">Save tab</button><button class="btn o" data-a="cancel">Cancel</button></div></div>`}
function cz(){const bk=CFG.pin&&!st.unl?'Unlock in the Privacy section above to see your backup text.':JSON.stringify({cfg:CFG,wl:st.wl,cs:ST.filter(s=>s.custom).map(s=>[s.s,s.n,s.sec,s.p])});
 $('#app').innerHTML=`<div class="card"><h2 style="margin-top:0">Make it yours</h2><div class="row"><input id="cn" placeholder="Your name (optional)" value="${esc(CFG.name)}"><button class="btn" data-a="savename">Save name</button></div><div class="nm">Show these built-in tabs:</div><div class="row" style="margin:6px 0 0">${BT.map(t=>`<label class="pk"><input type="checkbox" data-a="vis" data-b="${esc(t)}" ${CFG.hidden.includes(t)?'':'checked'}> ${esc(t)}</label>`).join('')}</div></div>
 ${priv()}<h2>Your tabs</h2><div class="card">${CFG.tabs.map(t=>`<div class="row" style="margin:0 0 8px;justify-content:space-between"><span><b>${esc(t.name)}</b> <span class="nm">· ${t.items.length} items · ${t.view}</span></span><span><button class="btn o" data-a="edit" data-id="${t.id}">Edit</button> <button class="btn o" data-a="deltab" data-id="${t.id}">Delete</button></span></div>`).join('')||'<div class="nm" style="margin-bottom:8px">No custom tabs yet.</div>'}<button class="btn" data-a="new">＋ New tab</button></div>
 ${st.ed?tabForm(st.ed):''}
 <h2>Backup or move to another device</h2><div class="card"><textarea id="bk" rows="4" style="width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px monospace">${esc(bk)}</textarea><div class="row" style="margin:8px 0 0"><button class="btn o" data-a="imp">Import from box</button></div><p class="note">Copy this text to keep a backup. Paste a backup into the box and press Import to restore it on another browser or phone.</p></div>
 ${sync()}<p class="note">Settings are saved in this browser only. Each person who opens the site gets their own tabs.</p>`}
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hp(pin,salt){const te=new TextEncoder(),k=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
async function chk(pin){return !!CFG.pin&&await hp(pin,CFG.pin.s)===CFG.pin.h}
let lt;const bump=()=>{clearTimeout(lt);if(st.unl)lt=setTimeout(()=>{st.unl=false;render()},300000)};
function lk(t){$('#app').innerHTML=`<div class="card" style="max-width:360px;margin:30px auto;text-align:center"><div style="font-size:34px">🔒</div><h2 style="margin:6px 0 4px">${esc(t.name)} is locked</h2><p class="nm">Enter your PIN to view this tab.</p><div class="row" style="justify-content:center"><input id="pn" type="password" placeholder="PIN" autocomplete="off"><button class="btn" data-a="unlock">Unlock</button></div><div id="pe" class="dn"></div></div>`;const i=$('#pn');i&&i.focus()}
function priv(){let b;
 if(!CFG.pin)b=`<p class="nm" style="margin:0 0 8px">Set a PIN to lock personal tabs. A locked tab stays hidden until the PIN is entered.</p><div class="row" style="margin:0"><input id="np" type="password" placeholder="New PIN (4+ characters)" autocomplete="new-password"><button class="btn" data-a="setpin">Set PIN</button></div>`;
 else if(!st.unl)b=`<p class="nm" style="margin:0 0 8px">🔒 Locked. Enter your PIN to edit locked tabs or see the backup.</p><div class="row" style="margin:0"><input id="pn" type="password" placeholder="PIN" autocomplete="off"><button class="btn" data-a="unlock">Unlock</button></div><div id="pe" class="dn"></div>`;
 else b=`<p class="nm" style="margin:0 0 8px">🔓 Unlocked. It locks again after 5 minutes of inactivity, or on reload.</p><div class="row" style="margin:0"><button class="btn o" data-a="lockNow">🔒 Lock now</button><input id="np" type="password" placeholder="New PIN" autocomplete="new-password"><button class="btn o" data-a="setpin">Change PIN</button><button class="btn o" data-a="rmpin">Remove PIN</button></div>`;
 return `<h2>Privacy</h2><div class="card">${b}<p class="note" style="margin-bottom:0">This lock lives in your browser. It keeps your tabs hidden from other people using this device or looking over a shoulder, but it is not strong security. Pick a longer PIN and do not rely on it for sensitive data.</p></div>`}
document.addEventListener('click',async e=>{bump();const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a=='unlock'){if(await chk($('#pn').value)){st.unl=true;bump();render()}else{$('#pe').textContent='Wrong PIN';$('#pn').value=''}}
 else if(a=='lockNow'){st.unl=false;render()}
