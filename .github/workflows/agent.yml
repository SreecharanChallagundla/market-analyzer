name: market-agent

on:
  schedule:
    - cron: "0 4,6,8,10 * * 1-5"   # 09:30, 11:30, 13:30, 15:30 IST, Mon-Fri (signals, reports, PCR)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-agent            # one run at a time across both workflows
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}       # optional
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}   # optional
        run: python market_agent.py --once

      - name: Publish data for the dashboard
        run: |
          git config user.name "market-agent"
          git config user.email "actions@users.noreply.github.com"
          for f in data.json live.json pcr.json history.json docs/data.json docs/live.json docs/pcr.json docs/history.json; do [ -f "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Update market data" && git pull --rebase --autostash && git push)
