name: market-agent

on:
  schedule:
    # 09:30, 11:30, 13:30, 15:30 IST (= 04:00, 06:00, 08:00, 10:00 UTC), Mon-Fri
    - cron: "0 4,6,8,10 * * 1-5"
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

permissions:
  contents: write                # needed so the job can commit data.json

concurrency:
  group: market-agent            # never run two copies at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}       # optional
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}   # optional
        run: python market_agent.py --once

      - name: Publish data for the dashboard
        run: |
          git config user.name "market-agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Update market data" && git pull --rebase && git push)
