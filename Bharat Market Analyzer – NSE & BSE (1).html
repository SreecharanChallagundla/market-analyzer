<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bharat Market Analyzer – NSE &amp; BSE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6eb;--ac:#2f5bea;--up:#0a8f4e;--dn:#d6342c;--upb:#e3f6ec;--dnb:#fde8e6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#262c36;--ac:#6f93ff;--up:#35c47c;--dn:#ff6b61;--upb:#12301f;--dnb:#3a1b19}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#8b94a3;--bd:#262c36;--ac:#6f93ff;--up:#35c47c;--dn:#ff6b61;--upb:#12301f;--dnb:#3a1b19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:17px;margin:0}h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button,.tabs button{background:none;border:0;color:var(--mu);padding:7px 13px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.tabs{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto}
.tabs button{border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--tx);border-color:var(--ac);font-weight:600}
main{padding:16px 18px;max-width:1150px;margin:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:13px}
.card.click{cursor:pointer}.card.click:hover,.card.sel{border-color:var(--ac)}
.nm{color:var(--mu);font-size:12px}.big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;font:inherit;min-width:200px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font:inherit}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.chart{position:relative;width:100%}.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--bg);padding:3px 8px;border-radius:6px;font-size:12px;display:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.stats div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.stats b{display:block;font-size:15px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:600;font-size:13px}
.badge.up{background:var(--upb)}.badge.dn{background:var(--dnb)}.badge.n{background:var(--bd);color:var(--tx)}
.heat{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.heat div{border-radius:9px;padding:14px 12px;cursor:pointer}.heat b{display:block;font-size:18px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:500;font-size:12px}td.r,th.r{text-align:right}tr.lk{cursor:pointer}tr.lk:hover{background:var(--bg)}
h2{font-size:15px;margin:18px 0 10px}.note{color:var(--mu);font-size:12px;margin-top:16px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
</style></head><body>
<header><h1>Bharat Market Analyzer<small>NSE (Nifty) &amp; BSE (Sensex) trend dashboards</small></h1>
<div class="seg" id="ex"><button data-x="NSE" class="on">NSE · Nifty</button><button data-x="BSE">BSE · Sensex</button></div></header>
<div class="tabs" id="tabs"></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const fmt=(n,d=2)=>n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls=n=>n>=0?'up':'dn',sg=n=>(n>=0?'+':'')+fmt(n)+'%';
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>[...s].reduce((h,c)=>Math.imul(h^c.charCodeAt(0),16777619),2166136261);
const N=250,cache={};
function series(k,base,vol,dr){if(cache[k])return cache[k];const r=rng(hash(k)),a=[1];
 for(let i=1;i<N;i++){const z=(r()+r()+r()-1.5)*2;a.push(a[i-1]*(1+dr/N+z*vol))}
 const f=base/a[N-1];return cache[k]=a.map(v=>v*f)}
const IDX={NSE:[['NIFTY 50',24800,.007,.09],['NIFTY BANK',53500,.009,.08],['NIFTY IT',38500,.011,.04],['NIFTY NEXT 50',69000,.009,.1],['NIFTY MIDCAP 100',57500,.011,.15],['NIFTY FMCG',56000,.007,.03]],
BSE:[['SENSEX',81500,.007,.09],['BSE 500',35500,.008,.11],['BSE MIDCAP',46500,.011,.14],['BSE SMALLCAP',53000,.012,.17],['BSE BANKEX',60500,.009,.08],['BSE IT',37500,.011,.04]]};
const ST=[['RELIANCE','Reliance Industries','Energy',1420,500325],['TCS','Tata Consultancy','IT',3250,532540],['HDFCBANK','HDFC Bank','Banking',1000,500180],['ICICIBANK','ICICI Bank','Banking',1420,532174],['INFY','Infosys','IT',1560,500209],['SBIN','State Bank of India','Banking',830,500112],['BHARTIARTL','Bharti Airtel','Telecom',1950,532454],['ITC','ITC Ltd','FMCG',415,500875],['LT','Larsen & Toubro','Infra',3600,500510],['HINDUNILVR','Hindustan Unilever','FMCG',2450,500696],['SUNPHARMA','Sun Pharma','Pharma',1700,524715],['MARUTI','Maruti Suzuki','Auto',12800,532500],['TATAMOTORS','Tata Motors','Auto',700,500570],['M&M','Mahindra & Mahindra','Auto',3300,500520],['AXISBANK','Axis Bank','Banking',1150,532215],['WIPRO','Wipro','IT',260,507685],['NTPC','NTPC','Power',340,532555],['ONGC','ONGC','Energy',245,500312],['TITAN','Titan Company','Consumer',3500,500114],['ASIANPAINT','Asian Paints','Consumer',2350,500820],['DRREDDY','Dr Reddy\'s Labs','Pharma',1250,500124],['ADANIPORTS','Adani Ports','Infra',1400,532921]]
.map(([s,n,sec,p,b],i)=>({s,n,sec,p,b,v:.012+(hash(s)%7)/1000,d:((hash(s)%20)-4)/100}));
try{JSON.parse(localStorage.getItem('cs')||'[]').forEach(([s,n,sec,p])=>ST.push(mkStock(s,n,sec,p)))}catch(e){}
const S=x=>series(x.s,x.p,x.v,x.d), I=x=>series(x[0],x[1],x[2],x[3]);
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((p,c)=>p+c,0)/n);
function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+g/l):100}
const chg=(a,d=1)=>(a[a.length-1]/a[a.length-1-d]-1)*100;
let st={x:'NSE',tab:'Overview',idx:0,sym:'RELIANCE',rg:126,wl:[]};
try{st.wl=JSON.parse(localStorage.getItem('wl')||'[]')}catch(e){}
if(!st.wl.length)st.wl=['TCS','HDFCBANK','ITC'];
const saveWL=()=>{try{localStorage.setItem('wl',JSON.stringify(st.wl))}catch(e){}};
function spark(a,w=180,h=44){const mn=Math.min(...a),mx=Math.max(...a),p=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+','+(h-2-(v-mn)/(mx-mn||1)*(h-4)).toFixed(1));
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:44px"><polyline fill="none" stroke="var(${a[a.length-1]>=a[0]?'--up':'--dn'})" stroke-width="1.6" points="${p.join(' ')}"/></svg>`}
function chart(id,ser,n,labels){const W=700,H=280,L=52,B=8,T=8,w=W-L-6,h=H-T-B;
 const sl=a=>a.slice(-n),all=ser.flatMap(s=>sl(s.d).filter(v=>v!=null)),mn=Math.min(...all),mx=Math.max(...all);
 const X=i=>L+i/(n-1)*w,Y=v=>T+(1-(v-mn)/(mx-mn||1))*h;
 let g='';for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--mu)">${fmt(v,0)}</text>`}
 const lines=ser.map(s=>{const d=sl(s.d);let p='';d.forEach((v,i)=>{if(v!=null)p+=(p?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});return `<path d="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" ${s.da?'stroke-dasharray="4 3"':''}/>`}).join('');
 const m=sl(ser[0].d),area=`<path d="M${X(0)} ${Y(mn)} ${m.map((v,i)=>'L'+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')} L${X(n-1)} ${Y(mn)}Z" fill="${ser[0].c}" opacity=".08"/>`;
 $(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}">${g}${area}${lines}<line id="cx" y1="${T}" y2="${H-B}" stroke="var(--mu)" opacity="0"/></svg><div class="tip"></div>`;
 const svg=$(id+' svg'),tip=$(id+' .tip'),cx=$('#cx');
 svg.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((x-L)/w*(n-1))));
  cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.setAttribute('opacity',1);
  tip.style.display='block';tip.style.left=Math.min(r.width-150,Math.max(0,X(i)/W*r.width-60))+'px';tip.style.top='6px';
  tip.textContent=`${labels(i,n)} · ₹${fmt(m[i])}`};
 svg.onmouseleave=()=>{tip.style.display='none';cx.setAttribute('opacity',0)}}
const dayLbl=(i,n)=>{const d=new Date(2026,9,26);d.setDate(d.getDate()-Math.round((n-1-i)*1.46));return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'})};
const tabs=['Overview','Stock Analyzer','Sectors','Movers & Watchlist','My Stocks'];
function render(){
 $('#tabs').innerHTML=tabs.map(t=>`<button class="${t==st.tab?'on':''}" data-t="${t}">${t}</button>`).join('');
 $('#ex').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.x==st.x));
 ({Overview:ov,'Stock Analyzer':an,Sectors:sec,'Movers & Watchlist':mv,'My Stocks':ms})[st.tab]()}
function ov(){const L=IDX[st.x];if(st.idx>=L.length)st.idx=0;
 $('#app').innerHTML=`<div class="grid">${L.map((x,i)=>{const a=I(x);return `<div class="card click ${i==st.idx?'sel':''}" data-i="${i}"><div class="nm">${x[0]}</div><div class="big">${fmt(a[N-1])}</div><div class="${cls(chg(a))}">${sg(chg(a))} <span class="nm">1D</span></div>${spark(a.slice(-60))}</div>`}).join('')}</div>
 <h2>${L[st.idx][0]} · trend</h2><div class="card"><div class="row" id="rg"></div><div class="chart" id="c1"></div><div class="stats" id="s1"></div></div>
 <h2>Breadth (${st.x==='NSE'?'Nifty 22':'Sensex-linked'} tracked stocks)</h2><div class="card" id="br"></div>
 <p class="note">Demo data: prices are simulated (seeded random walks near approximate levels), not live quotes. Not investment advice.</p>`;
 rangeBtns();const a=I(L[st.idx]);
 chart('#c1',[{d:a,c:'var(--ac)'},{d:sma(a,50),c:'#e59f0a',w:1.2,da:1},{d:sma(a,200),c:'#9b59b6',w:1.2,da:1}],Math.min(st.rg,N),dayLbl);
 const r=a.slice(-st.rg);const hi=Math.max(...a),lo=Math.min(...a);
 $('#s1').innerHTML=[['Period return',sg((r[r.length-1]/r[0]-1)*100)],['52W high',fmt(hi)],['52W low',fmt(lo)],['RSI (14)',fmt(rsi(a),1)],['vs 50-DMA',sg((a[N-1]/sma(a,50)[N-1]-1)*100)],['vs 200-DMA',sg((a[N-1]/sma(a,200)[N-1]-1)*100)]].map(([k,v])=>`<div><span class="nm">${k}</span><b>${v}</b></div>`).join('');
 const up=ST.filter(s=>chg(S(s))>=0).length;$('#br').innerHTML=`<div style="display:flex;height:14px;border-radius:7px;overflow:hidden"><div style="width:${up/ST.length*100}%;background:var(--up)"></div><div style="flex:1;background:var(--dn)"></div></div><div class="row" style="margin:8px 0 0"><span class="up">${up} advancing</span><span class="dn">${ST.length-up} declining</span></div>`}
function rangeBtns(){$('#rg').innerHTML=[[21,'1M'],[63,'3M'],[126,'6M'],[250,'1Y']].map(([n,l])=>`<button class="btn ${n==st.rg?'':'o'}" data-r="${n}">${l}</button>`).join('')}
function an(){const o=ST.map(s=>`<option value="${s.s}">${s.n}</option>`).join('');
 $('#app').innerHTML=`<div class="row"><input id="q" list="dl" placeholder="Search symbol e.g. TCS" value="${st.sym}"><datalist id="dl">${o}</datalist><button class="btn" id="go">Analyze</button><button class="btn o" id="wl">☆ Watchlist</button></div><div id="out"></div>`;draw()}
function draw(){const x=ST.find(s=>s.s==st.sym.toUpperCase());if(!x){$('#out').innerHTML='<div class="card">Symbol not found. Pick one from the suggestions.</div>';return}
 st.sym=x.s;const a=S(x),s20=sma(a,20),s50=sma(a,50),R=rsi(a),m20=chg(a,20),hi=Math.max(...a),lo=Math.min(...a),p=a[N-1];
 let sc=0;const why=[];
 if(p>s20[N-1]){sc++;why.push('Price above 20-DMA')}else why.push('Price below 20-DMA');
 if(s20[N-1]>s50[N-1]){sc++;why.push('20-DMA above 50-DMA (bullish crossover zone)')}else why.push('20-DMA below 50-DMA');
 if(R>50&&R<70){sc++;why.push('RSI '+fmt(R,0)+' shows healthy momentum')}else why.push(R>=70?'RSI '+fmt(R,0)+' overbought':'RSI '+fmt(R,0)+' weak/oversold');
 if(m20>0){sc++;why.push('Positive 20-day momentum')}else why.push('Negative 20-day momentum');
 const v=['Strong Downtrend','Downtrend','Sideways / Neutral','Uptrend','Strong Uptrend'][sc],bc=sc>=3?'up':sc<=1?'dn':'n';
 const pos=(p-lo)/(hi-lo)*100;
 $('#out').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="nm">${x.n} · ${x.sec} · ${st.x==='NSE'?'NSE: '+x.s:'BSE: '+x.b}</div><span class="big">₹${fmt(p)}</span> <span class="${cls(chg(a))}">${sg(chg(a))}</span></div><span class="badge ${bc}">${v}</span></div>
 <div class="row" id="rg"></div><div class="chart" id="c2"></div><div class="nm">— Price &nbsp;<span style="color:#e59f0a">- - 20-DMA</span> &nbsp;<span style="color:#9b59b6">- - 50-DMA</span></div>
 <div class="stats">${[['1W',sg(chg(a,5))],['1M',sg(chg(a,21))],['6M',sg(chg(a,125))],['1Y',sg(chg(a,249))],['RSI (14)',fmt(R,1)],['52W range pos.',fmt(pos,0)+'%'],['52W high','₹'+fmt(hi)],['52W low','₹'+fmt(lo)]].map(([k,t])=>`<div><span class="nm">${k}</span><b>${t}</b></div>`).join('')}</div>
 <h2>Why this signal</h2><ul style="margin:0;padding-left:18px">${why.map(w=>`<li>${w}</li>`).join('')}</ul></div><p class="note">Simulated demo data. Rule-based signal for illustration only — not investment advice.</p>`;
 rangeBtns();chart('#c2',[{d:a,c:'var(--ac)'},{d:s20,c:'#e59f0a',w:1.2,da:1},{d:s50,c:'#9b59b6',w:1.2,da:1}],st.rg,dayLbl);
 $('#wl').textContent=st.wl.includes(x.s)?'★ In watchlist':'☆ Watchlist'}
function sec(){const m={};ST.forEach(s=>{(m[s.sec]=m[s.sec]||[]).push(s)});
 const rows=Object.entries(m).map(([k,v])=>[k,v.reduce((p,s)=>p+chg(S(s)),0)/v.length,v]).sort((a,b)=>b[1]-a[1]);
 $('#app').innerHTML=`<h2 style="margin-top:0">Sector heatmap · 1D average change</h2><div class="heat">${rows.map(([k,c,v])=>`<div style="background:color-mix(in srgb,var(${c>=0?'--up':'--dn'}) ${Math.min(55,Math.abs(c)*28+8)}%,var(--card));border:1px solid var(--bd)" data-sec="${k}"><span class="nm" style="color:inherit;opacity:.8">${k} · ${v.length}</span><b>${sg(c)}</b></div>`).join('')}</div><div id="sd"></div>
 <p class="note">Tap a sector to list its stocks.</p>`}
function mv(){const d=ST.map(s=>({...s,c:chg(S(s)),p:S(s)[N-1]})).sort((a,b)=>b.c-a.c);
 const T=(l,t)=>`<div class="wrap"><table><tr><th>Stock</th><th class="r">LTP ₹</th><th class="r">1D</th></tr>${l.map(s=>`<tr class="lk" data-s="${s.s}"><td>${s.s}<div class="nm">${s.sec}</div></td><td class="r">${fmt(s.p)}</td><td class="r ${cls(s.c)}">${sg(s.c)}</td></tr>`).join('')}</table></div>`;
 const w=d.filter(s=>st.wl.includes(s.s));
 $('#app').innerHTML=`<div class="cols"><div class="card"><h2 style="margin-top:0">Top gainers</h2>${T(d.slice(0,5))}</div><div class="card"><h2 style="margin-top:0">Top losers</h2>${T(d.slice(-5).reverse())}</div></div>
 <h2>My watchlist</h2><div class="card">${w.length?T(w):'<span class="nm">Empty. Add stocks from the Stock Analyzer.</span>'}</div><p class="note">Simulated demo data. Watchlist is saved in this browser.</p>`}
function mkStock(sym,n,sec,p){const h=hash(sym);return{s:sym,n,sec,p,b:'—',v:.012+(h%7)/1000,d:((h%20)-4)/100,custom:true}}
const saveCustom=()=>{try{localStorage.setItem('cs',JSON.stringify(ST.filter(s=>s.custom).map(s=>[s.s,s.n,s.sec,s.p])))}catch(e){}};
function ms(){const c=ST.filter(s=>s.custom);
 $('#app').innerHTML=`<div class="card"><h2 style="margin-top:0">Add your own stocks</h2><p class="nm">One stock per line: <b>SYMBOL, Price, Company name, Sector</b>. Company name and sector are optional. Example: <code>ZOMATO, 250, Zomato, Consumer</code></p><textarea id="ta" rows="6" placeholder="ZOMATO, 250, Zomato, Consumer&#10;IRCTC, 780" style="width:100%;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit"></textarea><div class="row" style="margin:10px 0 0"><button class="btn" id="add">Add stocks</button><span id="msg" class="nm">${st.msg||''}</span></div></div>
 <h2>Your added stocks (${c.length})</h2><div class="card wrap">${c.length?`<table><tr><th>Symbol</th><th>Name</th><th>Sector</th><th class="r">Price ₹</th><th></th></tr>${c.map(s=>`<tr><td>${s.s}</td><td>${s.n}</td><td>${s.sec}</td><td class="r">${fmt(s.p)}</td><td class="r"><button class="btn o" data-del="${s.s}">Remove</button></td></tr>`).join('')}</table>`:'<span class="nm">None yet.</span>'}</div>
 <p class="note">Added stocks appear in the analyzer search, sector heatmap, movers and watchlist. Their price history is simulated around the price you enter, not fetched live. Saved in this browser.</p>`;st.msg=''}
function addStocks(){let ok=0,bad=0;$('#ta').value.split('\n').forEach(l=>{const p=l.split(',').map(x=>x.trim());if(!p[0])return;const sym=p[0].toUpperCase(),pr=parseFloat(p[1]);
  if(!(pr>0)||ST.some(s=>s.s==sym)){bad++;return}ST.push(mkStock(sym,p[2]||sym,p[3]||'Other',pr));ok++});
 saveCustom();st.msg=`${ok} added`+(bad?`, ${bad} skipped (bad price or already exists)`:'');ms()}
function delStock(sym){const i=ST.findIndex(s=>s.s==sym&&s.custom);if(i>=0)ST.splice(i,1);st.wl=st.wl.filter(w=>w!=sym);saveWL();saveCustom();ms()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-x],[data-i],[data-r],[data-s],[data-sec],[data-del],#add,#go,#wl');if(!t)return;
 if(t.dataset.t){st.tab=t.dataset.t;render()}
 else if(t.dataset.x){st.x=t.dataset.x;st.idx=0;render()}
 else if(t.dataset.i){st.idx=+t.dataset.i;ov()}
 else if(t.dataset.r){st.rg=+t.dataset.r;st.tab=='Overview'?ov():draw()}
 else if(t.dataset.s){st.sym=t.dataset.s;st.tab='Stock Analyzer';render()}
 else if(t.dataset.sec){const l=ST.filter(s=>s.sec==t.dataset.sec).map(s=>({...s,c:chg(S(s)),p:S(s)[N-1]}));
  $('#sd').innerHTML=`<h2>${t.dataset.sec}</h2><div class="card wrap"><table><tr><th>Stock</th><th class="r">LTP ₹</th><th class="r">1D</th><th class="r">1M</th></tr>${l.map(s=>`<tr class="lk" data-s="${s.s}"><td>${s.n}</td><td class="r">${fmt(s.p)}</td><td class="r ${cls(s.c)}">${sg(s.c)}</td><td class="r ${cls(chg(S(s),21))}">${sg(chg(S(s),21))}</td></tr>`).join('')}</table></div>`}
 else if(t.id=='add'){addStocks()}
 else if(t.dataset.del){delStock(t.dataset.del)}
 else if(t.id=='go'){st.sym=$('#q').value.trim()||st.sym;draw()}
 else if(t.id=='wl'){const i=st.wl.indexOf(st.sym);i<0?st.wl.push(st.sym):st.wl.splice(i,1);saveWL();$('#wl').textContent=i<0?'★ In watchlist':'☆ Watchlist'}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='q')$('#go').click()});
render();
</script></body></html>
